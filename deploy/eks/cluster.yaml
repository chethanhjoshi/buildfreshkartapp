# eksctl create cluster -f deploy/eks/cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: freshkart
  region: ap-south-1
  version: "1.33"
managedNodeGroups:
  - name: default
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20
